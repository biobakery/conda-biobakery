{% set name = "kneaddata" %}
{% set version = "0.12.4" %}
{% set hash_type = "sha256" %}
{% set hash_value = "f95811aeb7c4a74250ce3f62879676f4e3c970f20dad2d5f9628250a9c45a6c3" %}

package:
  name: '{{ name|lower }}'
  version: '{{ version }}'

source:
  fn: '{{ name }}-{{ version }}.tar.gz'
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  '{{ hash_type }}': '{{ hash_value }}'

build:
  number: 0
  entry_points:
    - kneaddata = kneaddata.knead_data:main
    - kneaddata_bowtie2_discordant_pairs = kneaddata.bowtie2_discordant_pairs:main
    - kneaddata_trf_parallel = kneaddata.trf_parallel:main
    - kneaddata_database = kneaddata.download_db:main
    - kneaddata_build_database = kneaddata.generate_db:main
    - kneaddata_read_count_table = kneaddata.read_count_table:main
    - kneaddata_test = kneaddata.tests.kneaddata_test:main
  script: python setup.py install --single-version-externally-managed --record=record.txt

requirements:
  build:
    # Bare "python" (not "python >=3") so conda-build's --python/CONDA_PY
    # variant actually pins the interpreter. With a version constraint here
    # conda-build ignores --python and silently builds against newest python.
    - python
    # setuptools 80 removed the "setup.py install" command that this recipe and
    # kneaddata's custom Install cmdclass (bundles trimmomatic/trf) rely on.
    - setuptools <80
    # bowtie2 is a build dep only so setup.py finds it on PATH and skips
    # downloading its own copy into bin/.
    - bowtie2 >=2.2
  run:
    - python
    - trf
    - bowtie2 >=2.2
    - fastqc
    - samtools
    - openjdk >=8

test:
  imports:
    - kneaddata
    - kneaddata.db_preprocessing
    - kneaddata.tests
  commands:
    - kneaddata --help
    - kneaddata_bowtie2_discordant_pairs --help
    - kneaddata_trf_parallel --help
    - kneaddata_database --help
    - kneaddata_build_database --help
    - kneaddata_read_count_table --help
    - kneaddata_test --help

about:
  home: http://huttenhower.sph.harvard.edu/kneaddata
  license: MIT
  license_family: MIT
  summary: KneadData is a tool designed to perform quality control on metagenomic sequencing data, especially data from microbiome experiments.
  description: KneadData is a tool designed to perform quality control on metagenomic sequencing data, especially data from microbiome experiments. In these experiments, samples are typically taken from a host in hopes of learning something about the microbial community on the host. However, metagenomic sequencing data from such experiments will often contain a high ratio of host to bacterial reads. This tool aims to perform principled in silico separation of b$
  doc_url: http://huttenhower.sph.harvard.edu/kneaddata

extra:
  recipe-maintainers:
    - kneaddata-users@googlegroups.com
